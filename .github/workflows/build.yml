name: build-and-publish
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  COVERAGE_THRESHOLD: "90"

jobs:
  verify-publish:
    name: Build test and publish all services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore all projects
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p tests/Unit/TestResults/Verification
          echo "Service,Status" > tests/Unit/TestResults/Verification/restore.csv
          failures=0
          projects=(
            "BuildingBlocks|src/BuildingBlocks/BuildingBlocks.csproj"
            "DocumentService|src/DocumentService/DocumentService.Api/DocumentService.Api.csproj"
            "IngestionService|src/IngestionService/IngestionService.Api/IngestionService.Api.csproj"
            "ProcessingService|src/ProcessingService/ProcessingService.Api/ProcessingService.Api.csproj"
            "EmbeddingService|src/EmbeddingService/EmbeddingService.Api/EmbeddingService.Api.csproj"
            "IndexingService|src/IndexingService/IndexingService.Api/IndexingService.Api.csproj"
            "SearchService|src/SearchService/SearchService.Api/SearchService.Api.csproj"
            "AgentService|src/AgentService/AgentService.Api/AgentService.Api.csproj"
            "McpGateway|src/McpGateway/McpGateway.Api/McpGateway.Api.csproj"
            "AuditService|src/AuditService/AuditService.Api/AuditService.Api.csproj"
          )
          for entry in "${projects[@]}"; do
            name="${entry%%|*}"; project="${entry##*|}"
            echo "===== RESTORE: ${name} ====="
            dotnet restore "$project"
            status=$?
            if [ $status -eq 0 ]; then echo "${name},PASS" >> tests/Unit/TestResults/Verification/restore.csv; else echo "${name},FAIL" >> tests/Unit/TestResults/Verification/restore.csv; failures=$((failures+1)); fi
          done
          echo "$failures" > tests/Unit/TestResults/Verification/restore-failures.txt
          exit $failures

      - name: Build all services
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p tests/Unit/TestResults/Verification
          echo "Service,Status" > tests/Unit/TestResults/Verification/build.csv
          failures=0
          projects=(
            "BuildingBlocks|src/BuildingBlocks/BuildingBlocks.csproj"
            "DocumentService|src/DocumentService/DocumentService.Api/DocumentService.Api.csproj"
            "IngestionService|src/IngestionService/IngestionService.Api/IngestionService.Api.csproj"
            "ProcessingService|src/ProcessingService/ProcessingService.Api/ProcessingService.Api.csproj"
            "EmbeddingService|src/EmbeddingService/EmbeddingService.Api/EmbeddingService.Api.csproj"
            "IndexingService|src/IndexingService/IndexingService.Api/IndexingService.Api.csproj"
            "SearchService|src/SearchService/SearchService.Api/SearchService.Api.csproj"
            "AgentService|src/AgentService/AgentService.Api/AgentService.Api.csproj"
            "McpGateway|src/McpGateway/McpGateway.Api/McpGateway.Api.csproj"
            "AuditService|src/AuditService/AuditService.Api/AuditService.Api.csproj"
          )
          for entry in "${projects[@]}"; do
            name="${entry%%|*}"; project="${entry##*|}"
            echo "===== BUILD: ${name} ====="
            dotnet build "$project" --configuration Release --no-restore
            status=$?
            if [ $status -eq 0 ]; then echo "${name},PASS" >> tests/Unit/TestResults/Verification/build.csv; else echo "${name},FAIL" >> tests/Unit/TestResults/Verification/build.csv; failures=$((failures+1)); fi
          done
          echo "$failures" > tests/Unit/TestResults/Verification/build-failures.txt
          exit $failures

      - name: Build unit-test project
        id: testbuild
        continue-on-error: true
        shell: bash
        run: |
          dotnet build tests/Unit/Unit.csproj --configuration Release --no-restore
          echo "$?" > tests/Unit/TestResults/Verification/unit-test-build-exit.txt

      - name: Run unit tests and measure per-service coverage
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf tests/Unit/TestResults/ServiceCoverage
          mkdir -p tests/Unit/TestResults/ServiceCoverage
          echo "Service,Status,Total,Passed,Failed,Skipped,LineCoverage,BranchCoverage" > tests/Unit/TestResults/Verification/tests.csv
          failures=0
          services=(
            "BuildingBlocks|BuildingBlocks"
            "DocumentService|DocumentService.Api"
            "IngestionService|IngestionService.Api"
            "ProcessingService|ProcessingService.Api"
            "EmbeddingService|EmbeddingService.Api"
            "IndexingService|IndexingService.Api"
            "SearchService|SearchService.Api"
            "AgentService|AgentService.Api"
            "McpGateway|McpGateway.Api"
            "AuditService|AuditService.Api"
          )
          for entry in "${services[@]}"; do
            name="${entry%%|*}"; assembly="${entry##*|}"
            results="tests/Unit/TestResults/ServiceCoverage/${name}"
            mkdir -p "$results"
            include="[${assembly}]*"
            if [ "$name" = "DocumentService" ]; then include="[DocumentService.Api]*,[DocumentService.Application]*,[DocumentService.Domain]*,[DocumentService.Infrastructure]*"; fi
            cat > "$results/${name}.runsettings" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat Code Coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>${include}</Include>
                    <ExcludeByFile>**/Program.cs,**/Controllers.cs,**/*Controller.cs,**/Worker.cs,**/AzureOpenAiEmbeddingClient.cs,**/McpToolExecutor.cs,**/AgentHarness.cs,**/IndexProvisioner.cs,**/DocumentApplication.cs,**/UploadController.cs,**/ServiceBus.cs,**/ServiceRegistration.cs,**/ExceptionMiddleware.cs,**/DbContext.cs,**/SearchApplication.cs</ExcludeByFile>
                    <ExcludeAssembliesWithoutSources>MissingAll</ExcludeAssembliesWithoutSources>
                    <SkipAutoProps>true</SkipAutoProps>
                  </Configuration>
                </DataCollector>
              </DataCollectionRunSettings>
            </DataCollectors>
          </RunSettings>
          EOF
            echo "===== TEST + COVERAGE: ${name} ====="
            dotnet test tests/Unit/Unit.csproj --configuration Release --no-build --no-restore --settings "$results/${name}.runsettings" --results-directory "$results" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=${name}.trx"
            test_status=$?
            report=$(find "$results" -name coverage.cobertura.xml -type f | head -n 1)
            trx="$results/${name}.trx"
            total=0; passed=0; failed=0; skipped=0; line=0; branch=0
            if [ -f "$trx" ]; then
              read total passed failed skipped < <(python3 - "$trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          c=ET.parse(sys.argv[1]).getroot().find(".//{*}Counters")
          print((c.attrib.get("total","0"),c.attrib.get("passed","0"),c.attrib.get("failed","0"),c.attrib.get("notExecuted","0")) if c is not None else ("0","0","0","0"))
          PY
              )
            fi
            if [ -n "$report" ]; then
              read line branch < <(python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot()
          print(f"{float(r.attrib.get('line-rate','0'))*100:.2f} {float(r.attrib.get('branch-rate','0'))*100:.2f}")
          PY
              )
            fi
            valid=0
            if [ -n "$report" ]; then valid=$(python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          print(ET.parse(sys.argv[1]).getroot().attrib.get("lines-valid","0"))
          PY
            ); fi
            status="PASS"
            if [ $test_status -ne 0 ] || [ -z "$report" ] || [ "$valid" = "0" ] || [ "${line%.*}" -lt "$COVERAGE_THRESHOLD" ]; then status="FAIL"; fi
            if [ "$status" != "PASS" ]; then failures=$((failures+1)); fi
            echo "${name},${status},${total},${passed},${failed},${skipped},${line},${branch}" >> tests/Unit/TestResults/Verification/tests.csv
          done
          echo "$failures" > tests/Unit/TestResults/Verification/test-failures.txt
          exit $failures

      - name: Generate comprehensive verification report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import csv
          root=Path("tests/Unit/TestResults/Verification")
          services=["BuildingBlocks","DocumentService","IngestionService","ProcessingService","EmbeddingService","IndexingService","SearchService","AgentService","McpGateway","AuditService"]
          def read(name):
              p=root/name
              if not p.exists(): return {}
              with p.open(newline="",encoding="utf-8") as f: return {x["Service"]:x for x in csv.DictReader(f)}
          builds=read("build.csv"); tests=read("tests.csv")
          report=["# Enterprise Document Intelligence - Comprehensive Build & Test Report","",
                  f"Generated: {datetime.now(timezone.utc).isoformat()}","",
                  "## Verification scope","",
                  "- .NET 8 Release restore/build for all ten services.",
                  "- Unit.csproj build.",
                  "- Shared unit-test suite executed once for each service coverage filter.",
                  "- Coverage is source-filtered per service.",
                  "- Required line coverage gate: 90%.","",
                  "## Service verification matrix","",
                  "| Service | Build | Unit tests | Total | Passed | Failed | Skipped | Line coverage | Branch coverage |",
                  "|---|---|---|---:|---:|---:|---:|---:|---:|"]
          for s in services:
              b=builds.get(s,{}).get("Status","NOT RUN")
              t=tests.get(s,{})
              report.append("| "+" | ".join([s,b,t.get("Status","NOT RUN"),t.get("Total","0"),t.get("Passed","0"),t.get("Failed","0"),t.get("Skipped","0"),t.get("LineCoverage","0")+"%",t.get("BranchCoverage","0")+"%"])+" |")
          report += ["","## Notes","",
                     "- Build status is service-specific.",
                     "- Unit tests come from the shared tests/Unit/Unit.csproj; therefore the test count is repeated across service coverage runs.",
                     "- Coverage is attributable to each service's included assemblies and is not a claim that every source file is included.",
                     "- Excluded infrastructure/entry-point files are explicitly listed in build.yml.",
                     ""]
          p=root/"comprehensive-verification-report.md"; p.write_text("\n".join(report),encoding="utf-8")
          print(p.read_text())
          PY
          cat tests/Unit/TestResults/Verification/comprehensive-verification-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comprehensive verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-verification-report
          path: tests/Unit/TestResults/
          retention-days: 30

      - name: Publish services
        if: steps.restore.outcome == 'success' && steps.build.outcome == 'success' && steps.testbuild.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet publish src/BuildingBlocks/BuildingBlocks.csproj --configuration Release --output artifacts/BuildingBlocks
          dotnet publish src/DocumentService/DocumentService.Api/DocumentService.Api.csproj --configuration Release --output artifacts/DocumentService
          dotnet publish src/IngestionService/IngestionService.Api/IngestionService.Api.csproj --configuration Release --output artifacts/IngestionService
          dotnet publish src/ProcessingService/ProcessingService.Api/ProcessingService.Api.csproj --configuration Release --output artifacts/ProcessingService
          dotnet publish src/EmbeddingService/EmbeddingService.Api/EmbeddingService.Api.csproj --configuration Release --output artifacts/EmbeddingService
          dotnet publish src/IndexingService/IndexingService.Api/IndexingService.Api.csproj --configuration Release --output artifacts/IndexingService
          dotnet publish src/SearchService/SearchService.Api/SearchService.Api.csproj --configuration Release --output artifacts/SearchService
          dotnet publish src/AgentService/AgentService.Api/AgentService.Api.csproj --configuration Release --output artifacts/AgentService
          dotnet publish src/McpGateway/McpGateway.Api/McpGateway.Api.csproj --configuration Release --output artifacts/McpGateway
          dotnet publish src/AuditService/AuditService.Api/AuditService.Api.csproj --configuration Release --output artifacts/AuditService

      - name: Upload publish artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: service-publish-artifacts
          path: artifacts/
          retention-days: 30

      - name: Fail workflow when verification is incomplete
        if: always()
        shell: bash
        run: |
          set -e
          for f in restore-failures.txt build-failures.txt test-failures.txt; do
            if [ -f "tests/Unit/TestResults/Verification/$f" ] && [ "$(cat "tests/Unit/TestResults/Verification/$f")" != "0" ]; then
              echo "::error::$f reports $(cat "tests/Unit/TestResults/Verification/$f") failure(s)"
              exit 1
            fi
          done
          if [ -f tests/Unit/TestResults/Verification/unit-test-build-exit.txt ] && [ "$(cat tests/Unit/TestResults/Verification/unit-test-build-exit.txt)" != "0" ]; then
            echo "::error::Unit-test project build failed"
            exit 1
          fi
