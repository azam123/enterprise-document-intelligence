services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: edi, POSTGRES_USER: edi, POSTGRES_PASSWORD: edi_dev_password }
    ports: ["5433:5432"]
    volumes: ["edi-postgres:/var/lib/postgresql/data", "./mvp/infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edi -d edi"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
  model-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 2; done; OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:3b && OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text"]
    restart: "no"
  ai-service:
    build: ./mvp/ai-service
    environment:
      DATABASE_URL: postgresql://edi:edi_dev_password@postgres:5432/edi
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: qwen2.5:3b
      EMBED_MODEL: nomic-embed-text
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTO_INIT_DB: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }
      kafka: { condition: service_started }
  gateway:
    build: ./mvp/dotnet-gateway
    ports: ["8080:8080"]
  web:
    build: ./mvp/web
    environment: { NEXT_PUBLIC_AI_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [ai-service]
volumes:
  edi-postgres:
  ollama-data:
